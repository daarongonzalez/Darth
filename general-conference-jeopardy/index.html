<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>General Conference Jeopardy</title>
<style>
  :root {
    --blue: #0a1f9e;
    --blue-tile: #1230c4;
    --blue-deep: #060f5c;
    --gold: #ffcc00;
    --gold-soft: #f5d66b;
    --ink: #03061f;
    --line: #02051a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(ellipse at top, #0d1a7a 0%, var(--ink) 70%) fixed;
    color: var(--gold);
    font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  h1, .amount, .cat, .clue, .answer, .title {
    font-family: Georgia, "Times New Roman", serif;
    text-transform: uppercase;
  }
  button {
    font: inherit; cursor: pointer; border-radius: 6px; border: 2px solid var(--gold);
    background: var(--blue-tile); color: var(--gold); padding: 10px 18px;
    font-weight: 700; letter-spacing: .04em;
  }
  button:hover:not(:disabled) { background: var(--gold); color: var(--blue-deep); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  input, select {
    font: inherit; padding: 10px 12px; border-radius: 6px;
    border: 2px solid var(--gold); background: #fff; color: var(--blue-deep);
  }
  [hidden] { display: none !important; }

  /* ---------- Setup screen ---------- */
  #setup { margin: auto; width: min(640px, 92vw); padding: 32px 0; text-align: center; }
  #setup h1 { font-size: clamp(2rem, 6vw, 3.4rem); margin: 0 0 4px; text-shadow: 3px 3px 0 #000; }
  #setup .sub { margin: 0 0 24px; color: var(--gold-soft); }
  .panel {
    background: var(--blue); border: 3px solid var(--gold); border-radius: 10px; padding: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  .add-row { display: flex; gap: 8px; }
  .add-row input { flex: 1; min-width: 0; }
  .hint { font-size: .85rem; color: var(--gold-soft); margin: 8px 0 0; text-align: left; }
  #roster { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  #roster li {
    background: var(--blue-deep); border: 2px solid var(--gold); border-radius: 999px;
    padding: 4px 6px 4px 14px; display: flex; align-items: center; gap: 8px;
  }
  #roster button { padding: 0 8px; border-radius: 999px; line-height: 1.5; border-width: 1px; }
  #startBtn { margin-top: 20px; font-size: 1.2rem; padding: 12px 32px; }

  /* ---------- Game screen ---------- */
  #game { flex: 1; display: flex; flex-direction: column; padding: 12px; gap: 12px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .title { font-size: clamp(1.1rem, 2.6vw, 1.8rem); font-weight: 700; text-shadow: 2px 2px 0 #000; }
  .topbar button { padding: 6px 12px; font-size: .85rem; }

  #board {
    flex: 1; display: grid; grid-template-columns: repeat(5, 1fr);
    gap: 6px; background: var(--line); padding: 6px; border-radius: 6px; min-height: 380px;
  }
  .cat {
    background: var(--blue); color: #fff; border: 2px solid var(--gold);
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-weight: 700; padding: 10px 6px; font-size: clamp(.75rem, 1.7vw, 1.35rem);
    text-shadow: 2px 2px 0 #000; line-height: 1.15; min-height: 70px;
  }
  .tile {
    background: var(--blue-tile); border: 2px solid var(--line); border-radius: 0;
    color: var(--gold); font-family: Georgia, "Times New Roman", serif; font-weight: 900;
    font-size: clamp(1.3rem, 4.4vw, 3.4rem); text-shadow: 3px 3px 0 #000;
    padding: 0; min-height: 70px; letter-spacing: 0;
  }
  .tile:hover:not(:disabled) { background: #2a4ae6; color: var(--gold); transform: scale(1.03); }
  .tile.used { background: #0a1243; color: transparent; text-shadow: none; cursor: default; opacity: 1; }

  /* ---------- Scoreboard ---------- */
  #scores {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px;
    max-height: 28vh; overflow-y: auto; padding: 2px;
  }
  .score {
    background: var(--blue); border: 2px solid var(--gold); border-radius: 8px;
    padding: 8px 10px; text-align: center;
  }
  .score.lead { background: #1a3ad8; box-shadow: 0 0 0 2px #fff inset; }
  .score .n { font-size: .9rem; color: #fff; overflow-wrap: anywhere; }
  .score .v { font-family: Georgia, serif; font-weight: 900; font-size: 1.6rem; }
  .score .v.neg { color: #ff8a8a; }
  #status { text-align: center; color: var(--gold-soft); min-height: 1.2em; }

  /* ---------- Card modal ---------- */
  .modal {
    position: fixed; inset: 0; background: rgba(2,4,20,.88); z-index: 10;
    display: flex; align-items: center; justify-content: center; padding: 12px;
    perspective: 1600px;
  }
  .flip {
    position: relative; width: min(94vw, 880px); height: min(82vh, 560px);
    transform-style: preserve-3d; transition: transform .75s cubic-bezier(.4,.1,.2,1);
  }
  .flip.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--blue); border: 4px solid var(--gold); border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; box-shadow: 0 14px 50px rgba(0,0,0,.7);
  }
  .face.front .amount { font-size: clamp(4rem, 16vw, 9rem); font-weight: 900; text-shadow: 5px 5px 0 #000; }
  .face.back { transform: rotateY(180deg); text-align: center; gap: 14px; }
  .meta { color: var(--gold-soft); font-size: .95rem; letter-spacing: .12em; text-transform: uppercase; }
  .clue { color: #fff; font-size: clamp(1.2rem, 3.4vw, 2.3rem); font-weight: 700; line-height: 1.3; text-shadow: 2px 2px 0 #000; overflow-y: auto; max-height: 45%; }
  .answer {
    color: var(--gold); font-size: clamp(1.3rem, 3.8vw, 2.6rem); font-weight: 900;
    border-top: 2px solid var(--gold); padding-top: 12px; text-shadow: 2px 2px 0 #000;
    overflow-y: auto; max-height: 30%;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
  .actions label { color: #fff; }

  @media (max-width: 600px) {
    #board { gap: 3px; padding: 3px; }
    .cat { padding: 6px 2px; min-height: 56px; }
    .tile { min-height: 56px; }
  }
  @media (prefers-reduced-motion: reduce) { .flip { transition: none; } }
</style>
</head>
<body>

<!-- ============================================================
     GAME CONTENT — edit only this block.
     Five categories, each with five clues ($100 to $500).
     "clue" is shown when the card flips; "answer" is revealed on the second step.
     ============================================================ -->
<script id="content">
const GAME_TITLE = "General Conference Jeopardy";
const GAME_SUBTITLE = "Apostrophe Software";   // shown under the title on the setup screen
const VALUES = [100, 200, 300, 400, 500];

const CATEGORIES = [
  { name: "Category One", clues: [
    { clue: "Sample clue, $100", answer: "Sample answer" },
    { clue: "Sample clue, $200", answer: "Sample answer" },
    { clue: "Sample clue, $300", answer: "Sample answer" },
    { clue: "Sample clue, $400", answer: "Sample answer" },
    { clue: "Sample clue, $500", answer: "Sample answer" },
  ]},
  { name: "Category Two", clues: [
    { clue: "Sample clue, $100", answer: "Sample answer" },
    { clue: "Sample clue, $200", answer: "Sample answer" },
    { clue: "Sample clue, $300", answer: "Sample answer" },
    { clue: "Sample clue, $400", answer: "Sample answer" },
    { clue: "Sample clue, $500", answer: "Sample answer" },
  ]},
  { name: "Category Three", clues: [
    { clue: "Sample clue, $100", answer: "Sample answer" },
    { clue: "Sample clue, $200", answer: "Sample answer" },
    { clue: "Sample clue, $300", answer: "Sample answer" },
    { clue: "Sample clue, $400", answer: "Sample answer" },
    { clue: "Sample clue, $500", answer: "Sample answer" },
  ]},
  { name: "Category Four", clues: [
    { clue: "Sample clue, $100", answer: "Sample answer" },
    { clue: "Sample clue, $200", answer: "Sample answer" },
    { clue: "Sample clue, $300", answer: "Sample answer" },
    { clue: "Sample clue, $400", answer: "Sample answer" },
    { clue: "Sample clue, $500", answer: "Sample answer" },
  ]},
  { name: "Category Five", clues: [
    { clue: "Sample clue, $100", answer: "Sample answer" },
    { clue: "Sample clue, $200", answer: "Sample answer" },
    { clue: "Sample clue, $300", answer: "Sample answer" },
    { clue: "Sample clue, $400", answer: "Sample answer" },
    { clue: "Sample clue, $500", answer: "Sample answer" },
  ]},
];
</script>
<!-- ================= END GAME CONTENT ================= -->

<!-- Setup screen -->
<section id="setup">
  <h1 id="setupTitle"></h1>
  <p class="sub" id="setupSub"></p>
  <div class="panel">
    <form class="add-row" id="addForm">
      <input id="nameInput" type="text" placeholder="Team or player name" aria-label="Team or player name" autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <p class="hint">Tip: paste several names separated by commas to add them all at once.</p>
    <ul id="roster" aria-label="Players"></ul>
    <button id="startBtn" disabled>Start Game</button>
  </div>
</section>

<!-- Game screen -->
<section id="game" hidden>
  <div class="topbar">
    <div class="title" id="gameTitle"></div>
    <button id="newGameBtn">New Game</button>
  </div>
  <div id="board" role="grid" aria-label="Game board"></div>
  <div id="status" aria-live="polite"></div>
  <div id="scores" aria-label="Scoreboard"></div>
</section>

<!-- Card modal -->
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-label="Clue">
  <div class="flip" id="flip">
    <div class="face front"><div class="amount" id="mAmount"></div></div>
    <div class="face back">
      <div class="meta" id="mMeta"></div>
      <div class="clue" id="mClue"></div>
      <div class="answer" id="mAnswer" hidden></div>
      <div class="actions" id="revealRow"><button id="revealBtn">Reveal Answer</button></div>
      <div class="actions" id="awardRow" hidden>
        <label for="awardSel">Award points to</label>
        <select id="awardSel"></select>
        <button id="awardBtn">Save &amp; Close</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const KEY = "gcJeopardy.v1";
  let state = { phase: "setup", players: [], used: {} };

  /* ----- Saved progress (optional; the game still works if storage is blocked) ----- */
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.players)) state = Object.assign(state, s);
    } catch (e) {}
  }

  const fmt = (n) => (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString();

  /* ----- Setup screen ----- */
  function renderRoster() {
    const ul = $("roster");
    ul.innerHTML = "";
    state.players.forEach((p, i) => {
      const li = document.createElement("li");
      const span = document.createElement("span");
      span.textContent = p.name;
      const x = document.createElement("button");
      x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", "Remove " + p.name);
      x.onclick = () => { state.players.splice(i, 1); save(); renderRoster(); };
      li.append(span, x);
      ul.appendChild(li);
    });
    $("startBtn").disabled = state.players.length === 0;
  }

  $("addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const names = $("nameInput").value.split(/[,\n]/).map((s) => s.trim()).filter(Boolean);
    names.forEach((name) => {
      if (!state.players.some((p) => p.name.toLowerCase() === name.toLowerCase())) {
        state.players.push({ name, score: 0 });
      }
    });
    $("nameInput").value = "";
    save(); renderRoster();
  });

  $("startBtn").onclick = () => { state.phase = "board"; save(); show(); };

  $("newGameBtn").onclick = () => {
    if (!confirm("Start a new game? Scores and played cards will be cleared.")) return;
    state = { phase: "setup", players: state.players.map((p) => ({ name: p.name, score: 0 })), used: {} };
    save(); show();
  };

  /* ----- Board ----- */
  function renderBoard() {
    const board = $("board");
    board.innerHTML = "";
    CATEGORIES.forEach((c) => {
      const h = document.createElement("div");
      h.className = "cat"; h.setAttribute("role", "columnheader"); h.textContent = c.name;
      board.appendChild(h);
    });
    VALUES.forEach((v, r) => {
      CATEGORIES.forEach((c, ci) => {
        const b = document.createElement("button");
        const id = ci + "-" + r;
        b.className = "tile"; b.textContent = "$" + v;
        b.setAttribute("aria-label", c.name + " for $" + v);
        if (state.used[id]) { b.classList.add("used"); b.disabled = true; b.setAttribute("aria-label", c.name + " $" + v + " (played)"); }
        b.onclick = () => openCard(ci, r);
        board.appendChild(b);
      });
    });
  }

  function renderScores() {
    const box = $("scores");
    box.innerHTML = "";
    const top = Math.max(...state.players.map((p) => p.score));
    state.players.forEach((p) => {
      const d = document.createElement("div");
      d.className = "score" + (p.score === top && top > 0 ? " lead" : "");
      const n = document.createElement("div"); n.className = "n"; n.textContent = p.name;
      const v = document.createElement("div"); v.className = "v" + (p.score < 0 ? " neg" : ""); v.textContent = fmt(p.score);
      d.append(n, v); box.appendChild(d);
    });
    const total = CATEGORIES.length * VALUES.length;
    const played = Object.keys(state.used).length;
    if (played >= total) {
      const winners = state.players.filter((p) => p.score === top).map((p) => p.name).join(" & ");
      $("status").textContent = "Game over! Winner: " + winners + " with " + fmt(top);
    } else {
      $("status").textContent = (total - played) + " cards remaining";
    }
  }

  /* ----- Card flow: tile click flips to clue; second step reveals answer and awards points ----- */
  let current = null;

  function openCard(ci, r) {
    const id = ci + "-" + r;
    if (state.used[id]) return;
    current = { ci, r, id, value: VALUES[r], data: CATEGORIES[ci].clues[r] };
    $("mAmount").textContent = "$" + current.value;
    $("mMeta").textContent = CATEGORIES[ci].name + " · $" + current.value;
    $("mClue").textContent = current.data.clue;
    $("mAnswer").textContent = current.data.answer;
    $("mAnswer").hidden = true;
    $("awardRow").hidden = true;
    $("revealRow").hidden = false;

    const sel = $("awardSel");
    sel.innerHTML = "";
    const none = document.createElement("option"); none.value = ""; none.textContent = "No one"; sel.appendChild(none);
    state.players.forEach((p, i) => {
      const o = document.createElement("option"); o.value = i; o.textContent = p.name; sel.appendChild(o);
    });

    // Mark as played right away so the same card cannot be picked twice
    state.used[id] = true; save(); renderBoard(); renderScores();

    $("flip").classList.remove("flipped");
    $("modal").hidden = false;
    void $("flip").offsetWidth;
    setTimeout(() => $("flip").classList.add("flipped"), 60);
    $("revealBtn").focus({ preventScroll: true });
  }

  $("revealBtn").onclick = () => {
    $("mAnswer").hidden = false;
    $("revealRow").hidden = true;
    $("awardRow").hidden = false;
    $("awardSel").focus();
  };

  function closeCard() {
    $("modal").hidden = true; $("flip").classList.remove("flipped"); current = null;
  }

  $("awardBtn").onclick = () => {
    const v = $("awardSel").value;
    if (v !== "" && current) state.players[Number(v)].score += current.value;
    save(); renderScores(); closeCard();
  };

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$("modal").hidden && !$("awardRow").hidden) closeCard();
  });

  /* ----- Screen switching ----- */
  function show() {
    const playing = state.phase === "board" && state.players.length > 0;
    $("setup").hidden = playing;
    $("game").hidden = !playing;
    if (playing) { renderBoard(); renderScores(); } else { renderRoster(); }
  }

  /* ----- Start ----- */
  $("setupTitle").textContent = GAME_TITLE;
  $("setupSub").textContent = GAME_SUBTITLE;
  $("gameTitle").textContent = GAME_TITLE;
  document.title = GAME_TITLE;
  load();
  show();
})();
</script>
</body>
</html>
